name: Weekly Arcade & App Builder ($0 Always-Free)

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      app_request:
        description: "Game or app idea requested from Site Navigator"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-arcade-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild arcade/manifest.json & log request
        run: |
          python3 - <<'PY'
          import json, os, time
          os.makedirs("arcade", exist_ok=True)
          manifest = {
            "updated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
            "games": [
              {"id": "snake", "name": "Retro Snake", "type": "canvas", "license": "Built-in"},
              {"id": "breakout", "name": "Brick Breaker", "type": "canvas", "license": "Built-in"},
              {"id": "wasm4", "name": "WASM-4 Snake", "type": "iframe", "path": "./arcade/wasm4-snake/wasm4-snake.html", "license": "ISC"},
              {"id": "nes", "name": "8-Bit Table Tennis (JSNES)", "type": "iframe", "path": "./arcade/nes-table-tennis/index.html", "license": "Apache-2.0 + MIT"}
            ]
          }
          req = os.environ.get("APP_REQUEST", "").strip()
          if req:
            req_file = "arcade/requests.json"
            existing = json.load(open(req_file)) if os.path.exists(req_file) else {"requests": []}
            existing["requests"].insert(0, {"request": req, "requested_at": manifest["updated_at"], "status": "queued"})
            json.dump(existing, open(req_file, "w"), indent=2)
          json.dump(manifest, open("arcade/manifest.json", "w"), indent=2)
          PY
        env:
          APP_REQUEST: ${{ github.event.inputs.app_request }}
      - name: Commit updates if changed
        run: |
          git config user.name "schafferai-bot"
          git config user.email "bot@schafferai.com"
          git add arcade/
          git diff --staged --quiet || (git commit -m "chore(arcade): weekly $0 manifest & request sync" && git push)
